apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ticketportal
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ticketportal/gateway:placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ticketportal
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
