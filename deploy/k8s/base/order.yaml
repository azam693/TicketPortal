apiVersion: v1
kind: Secret
metadata:
  name: order-secrets
  namespace: ticketportal
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=order-postgres;Port=5432;Database=order;Username=order;Password=order"
  ConnectionStrings__RabbitMq: "rabbitmq://rabbitmq:rabbitmq@rabbitmq:5672"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketportal
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ticketportal/order:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: order-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ticketportal
spec:
  selector:
    app: order
  ports:
    - port: 8080
      targetPort: 8080
