apiVersion: v1
kind: Secret
metadata:
  name: booking-secrets
  namespace: ticketportal
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=booking-postgres;Port=5432;Database=booking;Username=booking;Password=booking"
  ConnectionStrings__RabbitMq: "rabbitmq://rabbitmq:rabbitmq@rabbitmq:5672"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: ticketportal
  labels:
    app: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          image: ticketportal/booking:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: booking-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: ticketportal
spec:
  selector:
    app: booking
  ports:
    - port: 8080
      targetPort: 8080
