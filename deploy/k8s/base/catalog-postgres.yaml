apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-postgres-data
  namespace: ticketportal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-postgres
  namespace: ticketportal
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: catalog-postgres
  template:
    metadata:
      labels: 
        app: catalog-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: catalog
            - name: POSTGRES_PASSWORD
              value: catalog
            - name: POSTGRES_DB
              value: catalog
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
  namespace: ticketportal
spec:
  selector:
    app: catalog-postgres
  ports:
    - port: 5432
      targetPort: 5432
