apiVersion: v1
kind: Secret
metadata: 
  name: catalog-secrets
  namespace: ticketportal
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=catalog-postgres;Port=5432;Database=catalog;Username=catalog;Password=catalog"
  ConnectionStrings__RabbitMq: "rabbitmq://rabbitmq:rabbitmq@rabbitmq:5672"
  ConnectionStrings__Redis: "catalog-redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ticketportal
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ticketportal/catalog:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: catalog-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ticketportal
spec:
  selector:
    app: "catalog"
  ports:
    - port: 8080
      targetPort: 8080
