apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booking-postgres-data
  namespace: ticketportal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-postgres
  namespace: ticketportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-postgres
  template:
    metadata:
      labels:
        app: booking-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: booking
            - name: POSTGRES_PASSWORD
              value: booking
            - name: POSTGRES_DB
              value: booking
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: booking-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: booking-postgres
  namespace: ticketportal
spec:
  selector:
    app: booking-postgres
  ports:
    - port: 5432
      targetPort: 5432
