name: ticketportal

services:
  catalog-postgres:
    image: postgres:17-alpine
    container_name: tp-catalog-postgres
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
    ports:
      - "5432:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog} -d ${CATALOG_DB_NAME:-catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  booking-postgres:
    image: postgres:17-alpine
    container_name: tp-booking-postgres
    environment:
        POSTGRES_USER: ${BOOKING_DB_USER:-booking}
        POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
        POSTGRES_DB: ${BOOKING_DB_NAME:-booking}
    ports:
        - "5433:5432"
    volumes:
        - booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-booking} -d ${BOOKING_DB_NAME:-booking}"]
        interval: 10s
        timeout: 5s
        retries: 5

  catalog-redis:
    image: redis:7-alpine
    container_name: tp-catalog-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - catalog-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
        - "5672:5672"
        - "15672:15672"
    environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
    volumes:
        - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  catalog-postgres-data:
  catalog-redis-data:
  booking-postgres-data:
  rabbitmq_data:
