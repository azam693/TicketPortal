name: CI
on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      
      - name: Restore
        run: dotnet restore TicketPortal.slnx
        
      - name: Build
        run: dotnet build TicketPortal.slnx --no-resore --configuration Release
        
      - name: Test
        run: dotnet test TicketPortal.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: "**/test-results.trx"
          reporter: dotnet-trx
